[project]
name = "tripadvisor-classification"
version = "0.1.0"
description = "Classification de satisfaction sur les avis hoteliers TripAdvisor"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "wordcloud>=1.9",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[tool.uv]
# Environnement seul, pas un package a installer
package = false
